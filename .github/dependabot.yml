# Dependency update pull requests. Versions are pinned exactly (.npmrc save-exact), so these are the way to move them.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # one pull request for all minor and patch updates; majors come one by one
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # must stay on the major israeli-bank-scrapers uses (its Browser type is passed straight in)
      - dependency-name: puppeteer
        update-types: [version-update:semver-major]
      # follows the Node major the worker image runs (26); moves with it
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directories: [/, /deploy/caddy]
    schedule:
      interval: monthly
    ignore:
      # Node majors move by hand, to the next even (LTS) release, together with CI and @types/node
      - dependency-name: node
        update-types: [version-update:semver-major]
